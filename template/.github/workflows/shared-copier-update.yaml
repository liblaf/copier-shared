        name: Auth
        uses: liblaf/actions/auth@9fd2d15e0a9630dc702d355704d8dfdd3e37cae4 # v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5
      - name: Install Copier
        run: pipx install --pip-args cookiecutter copier
      - name: Copier update
        run: mise run copier-update --skip-answered --trust --force

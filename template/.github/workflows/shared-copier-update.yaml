        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8
        with:
          token: ${{ steps.auth.outputs.token }}
          commit-message: "chore(copier): update from template"
          branch: copier-update/${{ github.ref_name }}
          delete-branch: true
          sign-commits: true
          title: "chore(copier): update from template"
          body: >-
            Automated changes by [${{ github.workflow }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) Workflow
          labels: |-
